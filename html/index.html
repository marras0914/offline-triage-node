<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Relief Network</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f5; color: #18181b; padding: 20px; max-width: 500px; margin: 0 auto; }
        .header { background-color: #ef4444; color: white; padding: 20px; border-radius: 8px 8px 0 0; text-align: center; }
        .form-container { background: white; padding: 20px; border-radius: 0 0 8px 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #d4d4d8; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #ef4444; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:active { background-color: #dc2626; }
        button:disabled { background-color: #fca5a5; cursor: default; }
        .status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Local Emergency Network</h2>
        <p>Submit a request for local offline assistance.</p>
    </div>
    <div class="form-container">
        <form id="sosForm">
            <label for="name">Name or Family Name</label>
            <input type="text" id="name" required placeholder="e.g., The Smith Family">

            <label for="location">Current Location</label>
            <input type="text" id="location" required placeholder="e.g., Corner of 4th and Main">

            <label for="message">What do you need?</label>
            <textarea id="message" rows="4" required placeholder="Describe the emergency or supplies needed..."></textarea>

            <button type="submit">Submit Request</button>
            <div id="statusMessage" class="status"></div>
        </form>
    </div>

    <script>
        var form = document.getElementById('sosForm');
        var button = form.querySelector('button');
        var statusDiv = document.getElementById('statusMessage');

        var AMBER = "#d97706", GREEN = "#16a34a", RED = "#dc2626";
        function show(text, colour) { statusDiv.textContent = text; statusDiv.style.color = colour; }

        // The phone holds the request until the node confirms it.
        //
        // Almost everyone arrives here with a phone, at the edge of a mesh, while
        // moving. Losing the network mid-submit used to lose what they typed and
        // tell them to try again — asking a frightened person to retype an
        // emergency. The phone is a perfectly good place to keep it meanwhile.
        var PENDING = 'triage.pending';
        function loadPending() {
            try { return JSON.parse(localStorage.getItem(PENDING) || 'null'); } catch (e) { return null; }
        }
        function savePending(p) {
            // Private browsing can refuse this. Nothing to be done, and it must
            // not stop the send attempt itself.
            try { localStorage.setItem(PENDING, JSON.stringify(p)); } catch (e) {}
        }
        function clearPending() { try { localStorage.removeItem(PENDING); } catch (e) {} }

        async function send(payload) {
            var response;
            try {
                // Same-origin: nginx proxies this to the n8n webhook, so there is
                // no CORS preflight and no node IP to substitute into this file.
                response = await fetch('/api/sos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (networkError) {
                var offline = new Error('no answer from the node');
                offline.retryable = true;
                throw offline;
            }

            var result = await response.json().catch(function () { return {}; });

            // A crashed n8n execution answers 200 with an empty body, so
            // response.ok alone would show "help is coming" when nothing was
            // stored. Only an explicit status:received from the workflow's final
            // node counts as success.
            if (result.status !== 'received') {
                var failure = new Error('request was not stored');
                failure.detail = result.message || '';
                // 400 means the submission itself was refused, and resending the
                // same content would only be refused again. Everything else — a
                // rate-limit shed, a restarting node — is worth retrying.
                failure.retryable = response.status !== 400;
                throw failure;
            }
            return result;
        }

        // 15s, chosen to stay under the node's per-device rate limit of 10/min.
        // A tighter loop would trip its own shedding and retry against a 429
        // forever.
        var RETRY_MS = 15000;
        var retryTimer = null;
        function stopRetrying() { if (retryTimer) { clearInterval(retryTimer); retryTimer = null; } }
        function startRetrying() {
            if (retryTimer) return;
            // Safe to retry because the node suppresses a byte-identical repeat
            // inside ten minutes, so a retry cannot pile duplicates into a
            // coordinator's queue.
            retryTimer = setInterval(async function () {
                var pending = loadPending();
                if (!pending) { stopRetrying(); return; }
                try { reportSuccess(await send(pending.payload)); }
                catch (e) { if (!e.retryable) { clearPending(); stopRetrying(); } }
            }, RETRY_MS);
        }

        function reportSuccess(result) {
            clearPending();
            stopRetrying();
            if (result.already_logged) {
                // An identical message inside ten minutes is recorded against the
                // request already in the queue. Saying so is more honest than
                // implying a second request now exists.
                show("We already have this request. It is in the queue"
                    + (result.id ? " (#" + result.id + ")" : "") + " and help is being routed.", GREEN);
            } else {
                show(result.id
                    ? "Request #" + result.id + " received. Help is being routed."
                    : "Request received. Help is being routed.", GREEN);
            }
            form.reset();
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            // Held down until the request settles. A slow local model means
            // several seconds of nothing happening, which is exactly when a
            // frightened person taps the button again.
            button.disabled = true;
            show("Sending... keep this page open.", AMBER);

            var payload = {
                name: document.getElementById('name').value,
                location: document.getElementById('location').value,
                message: document.getElementById('message').value
            };
            // Written down before the first attempt, so losing the network
            // mid-send cannot lose what the person typed.
            savePending({ payload: payload, at: Date.now() });

            try {
                reportSuccess(await send(payload));
            } catch (error) {
                if (error.retryable) {
                    // Never "sent". It is on the phone, which is not the same
                    // thing, and saying otherwise would be the worst kind of lie
                    // this page could tell.
                    show("NOT SENT YET — saved on this phone. It will keep trying by itself. "
                        + "Stay on this page, and move closer to the network if you can.", RED);
                    startRetrying();
                } else {
                    clearPending();
                    show("NOT SENT. " + (error.detail ? error.detail + " " : "")
                        + "If this keeps failing, find a triage coordinator in person.", RED);
                }
            } finally {
                button.disabled = false;
            }
        });

        // A request the phone carried out of range and back, or across a reload.
        (function resume() {
            if (!loadPending()) return;
            show("A request saved on this phone was never sent. Trying again now...", AMBER);
            startRetrying();
        })();
    </script>
</body>
</html>
