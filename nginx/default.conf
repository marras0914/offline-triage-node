# Rate limiting belongs here, in front of everything, because the expensive part
# is downstream: Ollama serialises inference, so a flood does not merely fill a
# coordinator's queue with junk, it makes real requests wait behind it.
#
# Intake stays unauthenticated — demanding credentials during a disaster would be
# indefensible — so these limits are the only thing between an open SSID and a
# denial of service. Note this is also the counterpart to the injection flag in
# Validate Triage: flagged rows are forced to Critical, which means sprayed
# injection strings would otherwise be an amplifier straight into the top tier.
#
# Sized so a frightened household submitting three or four times is unaffected.
limit_req_zone  $binary_remote_addr zone=sos_per_ip:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=sos_conns:1m;
# Keyed on a constant, so this one is a cap on total concurrent inference rather
# than a per-client limit. Without it, fifty clients each hold a 300s read
# timeout and the node stops answering anyone.
limit_conn_zone $server_name        zone=sos_total:1m;

limit_req_status  429;
limit_conn_status 429;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Needed because the proxy_pass below goes through a
    # variable, which defers name resolution to request time — nginx then starts
    # even if n8n is not up yet, and recovers on its own when n8n comes back.
    # With a literal upstream, a missing n8n container aborts nginx at boot.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /var/log/nginx/access.log;

    # The portal's own origin fronts the webhook. Two reasons this is not a
    # direct browser call to :5678 — a cross-origin fetch with a JSON body
    # triggers a CORS preflight that n8n has to be configured to answer, and a
    # hard-coded node IP in the HTML breaks the moment the node's address moves.
    location = /api/sos {
        limit_except POST { deny all; }

        # burst=5 nodelay: a household hammering the button three or four times
        # sails through, while a sustained flood is shed at 10/min per device.
        limit_req  zone=sos_per_ip burst=5 nodelay;
        limit_conn sos_conns 2;
        limit_conn sos_total 8;

        set $n8n_webhook "http://n8n:5678/webhook/sos-intake";
        proxy_pass $n8n_webhook;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Local LLM inference on an iGPU is slow, and a cold model load is slower
        # still. Well under the 180s timeout on the Ollama node itself.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Nothing here is cacheable, and a captive portal sits behind a lot of
        # opportunistic middleboxes.
        add_header Cache-Control "no-store" always;

        error_page 429 = @rate_limited;
    }

    # A shed request must be told it was shed. nginx's stock 429 is an HTML page,
    # which the portal cannot read — and the portal treats anything without an
    # explicit status:received as failure, so a silent shed would surface as the
    # generic "NOT SENT" with no hint that waiting would help. This gives the
    # person something actionable instead.
    location @rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 '{"status":"rejected","message":"Too many requests from this device. Wait a moment, then send again."}';
    }

    location / {
        # Captive portal detection probes hit arbitrary paths (/generate_204,
        # /hotspot-detect.html, ...). Serving the form for all of them is what
        # makes the phone pop the portal open instead of reporting no internet.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

# The coordinator alarm, on its own port.
#
# Separate from :80 on purpose. Port 80 is the only port the guest VLAN reaches,
# and this exposes operational state — queue depth, how far behind the node is —
# which is nobody's business on an open SSID. Keep 8081 on the operator network
# with 5678 and 8080.
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/watch;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api/queue-health {
        limit_except GET { deny all; }

        set $n8n_health "http://n8n:5678/webhook/queue-health";
        proxy_pass $n8n_health;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Short, because a stalled poll must surface as "alarm is blind" rather
        # than as a page that quietly stops updating.
        proxy_connect_timeout 3s;
        proxy_read_timeout    8s;

        # n8n keeps its own state in the same Postgres, so when the database dies
        # n8n answers 503 for everything and the workflow's own "cannot read the
        # queue" branch never gets to run. Catch it here and answer in the shape
        # the page understands, so total database loss says so immediately instead
        # of looking like a page that stopped refreshing.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @health_blind;

        add_header Cache-Control "no-store" always;
    }

    location @health_blind {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        # 503, not 200: this is a real failure and should look like one to
        # anything else that ever polls it.
        return 503 '{"level":"critical","headline":"ALARM IS BLIND","detail":"The node is not answering. A quiet screen means nothing right now.","action":"On the node: docker compose ps, then docker compose logs postgres n8n","unreadable":true,"counts":{}}';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
