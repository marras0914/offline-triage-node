server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Needed because the proxy_pass below goes through a
    # variable, which defers name resolution to request time — nginx then starts
    # even if n8n is not up yet, and recovers on its own when n8n comes back.
    # With a literal upstream, a missing n8n container aborts nginx at boot.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /var/log/nginx/access.log;

    # The portal's own origin fronts the webhook. Two reasons this is not a
    # direct browser call to :5678 — a cross-origin fetch with a JSON body
    # triggers a CORS preflight that n8n has to be configured to answer, and a
    # hard-coded node IP in the HTML breaks the moment the node's address moves.
    location = /api/sos {
        limit_except POST { deny all; }

        set $n8n_webhook "http://n8n:5678/webhook/sos-intake";
        proxy_pass $n8n_webhook;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Local LLM inference on an iGPU is slow, and a cold model load is slower
        # still. Well under the 180s timeout on the Ollama node itself.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Nothing here is cacheable, and a captive portal sits behind a lot of
        # opportunistic middleboxes.
        add_header Cache-Control "no-store" always;
    }

    location / {
        # Captive portal detection probes hit arbitrary paths (/generate_204,
        # /hotspot-detect.html, ...). Serving the form for all of them is what
        # makes the phone pop the portal open instead of reporting no internet.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
